[package]
name = "weight-check-core"
version.workspace = true
edition.workspace = true
description = "Model lifecycle, benchmarks and storage behind the weight-check desktop app"

[features]
# Exposes the in-memory fakes in `service::testing` to other crates' tests.
testing = []

[dependencies]
async-trait.workspace = true
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
parquet = { version = "60", default-features = false, features = ["json", "snap"] }
regex = "1"
# rustls (webpki roots) for HTTPS dataset downloads, without a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
sysinfo = "0.33"
tempfile.workspace = true
thiserror = "2"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Stand-in llama-server for the `LlamaHttpClient` tests.
axum = "0.8"
tokio = { workspace = true, features = ["test-util"] }
