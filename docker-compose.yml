services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: weight-check-postgres
    environment:
      POSTGRES_USER: weight
      POSTGRES_PASSWORD: weight
      POSTGRES_DB: weight_check
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weight -d weight_check"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
